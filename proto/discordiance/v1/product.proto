syntax = "proto3";

package discordiance.v1;

import "discordiance/v1/types.proto";

option go_package = "github.com/nickheyer/discordiance/pkg/proto/discordiance/v1;discordiancev1";

// ProductService provides CRUD operations for products.
service ProductService {
  // ListProducts returns all products.
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse) {}
  // GetProduct returns a single product by ID.
  rpc GetProduct(GetProductRequest) returns (GetProductResponse) {}
  // CreateProduct creates a new product.
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse) {}
  // UpdateProduct updates an existing product.
  rpc UpdateProduct(UpdateProductRequest) returns (UpdateProductResponse) {}
  // DeleteProduct deletes a product and all its configs.
  rpc DeleteProduct(DeleteProductRequest) returns (DeleteProductResponse) {}
}

// ListProductsRequest is an empty request to list all products.
message ListProductsRequest {}

// ListProductsResponse contains a list of products.
message ListProductsResponse {
  repeated Product products = 1;
}

// GetProductRequest requests a product by ID.
message GetProductRequest {
  uint64 id = 1;
}

// GetProductResponse contains the requested product.
message GetProductResponse {
  Product product = 1;
}

// CreateProductRequest creates a new product.
message CreateProductRequest {
  string name = 1;
  bool enabled = 2;
  string description = 3;
  string repo_url = 4;
  string github_token = 5;
}

// CreateProductResponse contains the created product.
message CreateProductResponse {
  Product product = 1;
}

// UpdateProductRequest updates an existing product.
message UpdateProductRequest {
  uint64 id = 1;
  string name = 2;
  bool enabled = 3;
  string description = 4;
  string repo_url = 5;
  string github_token = 6;
}

// UpdateProductResponse contains the updated product.
message UpdateProductResponse {
  Product product = 1;
}

// DeleteProductRequest deletes a product by ID.
message DeleteProductRequest {
  uint64 id = 1;
}

// DeleteProductResponse is an empty response for delete operations.
message DeleteProductResponse {}
