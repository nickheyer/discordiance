syntax = "proto3";

package discordiance.v1;

import "discordiance/v1/types.proto";

option go_package = "github.com/nickheyer/discordiance/pkg/proto/discordiance/v1;discordiancev1";

// AgentService provides CRUD for agents.
service AgentService {
  // ListAgents returns all agents.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {}
  // GetAgent returns a single agent by ID.
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse) {}
  // CreateAgent creates a new agent.
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse) {}
  // UpdateAgent updates an existing agent.
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse) {}
  // DeleteAgent deletes an agent.
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse) {}
}

// ListAgentsRequest is empty.
message ListAgentsRequest {}

// ListAgentsResponse contains all agents.
message ListAgentsResponse {
  repeated Agent agents = 1;
}

// GetAgentRequest requests an agent by ID.
message GetAgentRequest {
  uint64 id = 1;
}

// GetAgentResponse contains the requested agent.
message GetAgentResponse {
  Agent agent = 1;
}

// CreateAgentRequest creates an agent.
message CreateAgentRequest {
  string name = 1;
  string base_url = 2;
  string api_key = 3;
  string org_id = 8;
  string model = 4;
  string system_prompt = 5;
  int32 batch_size = 6;
  int32 batch_timeout = 7;
}

// CreateAgentResponse contains the created agent.
message CreateAgentResponse {
  Agent agent = 1;
}

// UpdateAgentRequest updates an agent.
message UpdateAgentRequest {
  uint64 id = 1;
  string name = 2;
  string base_url = 3;
  string api_key = 4;
  string org_id = 9;
  string model = 5;
  string system_prompt = 6;
  int32 batch_size = 7;
  int32 batch_timeout = 8;
}

// UpdateAgentResponse contains the updated agent.
message UpdateAgentResponse {
  Agent agent = 1;
}

// DeleteAgentRequest deletes an agent by ID.
message DeleteAgentRequest {
  uint64 id = 1;
}

// DeleteAgentResponse is empty.
message DeleteAgentResponse {}
