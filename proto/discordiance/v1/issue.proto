syntax = "proto3";

package discordiance.v1;

import "discordiance/v1/types.proto";

option go_package = "github.com/nickheyer/discordiance/pkg/proto/discordiance/v1;discordiancev1";

// IssueService provides operations for viewing and managing issues.
service IssueService {
  // ListIssues returns all issues.
  rpc ListIssues(ListIssuesRequest) returns (ListIssuesResponse) {}
  // GetIssue returns a single issue by ID.
  rpc GetIssue(GetIssueRequest) returns (GetIssueResponse) {}
  // UpdateIssueStatus updates the status of an issue.
  rpc UpdateIssueStatus(UpdateIssueStatusRequest) returns (UpdateIssueStatusResponse) {}
}

// ListIssuesRequest lists issues with optional filters.
message ListIssuesRequest {
  uint64 product_id = 1;
  string status = 2;
  int32 page_size = 3;
  int32 page = 4;
}

// ListIssuesResponse contains a list of issues.
message ListIssuesResponse {
  repeated Issue issues = 1;
  int32 total_count = 2;
}

// GetIssueRequest requests an issue by ID.
message GetIssueRequest {
  uint64 id = 1;
}

// GetIssueResponse contains the requested issue.
message GetIssueResponse {
  Issue issue = 1;
}

// UpdateIssueStatusRequest updates an issue's status.
message UpdateIssueStatusRequest {
  uint64 id = 1;
  string status = 2;
}

// UpdateIssueStatusResponse contains the updated issue.
message UpdateIssueStatusResponse {
  Issue issue = 1;
}
