syntax = "proto3";

package discordiance.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nickheyer/discordiance/pkg/proto/discordiance/v1;discordiancev1";

// Product represents a monitored product.
message Product {
  uint64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  string name = 4;
  bool enabled = 5;
  string description = 9;
  string repo_url = 10;
  bool has_github_token = 11;
}

// DiscordPlatformSettings contains the settings for a Discord platform source.
message DiscordPlatformSettings {
  string token = 1;
  string channel_ids = 2;
}

// GitHubReporterSettings contains the settings for a GitHub Issues reporter.
message GitHubReporterSettings {
  string token = 1;
  string repo = 2;
  string labels = 3;
  bool auto_file = 4;
}

// Platform represents a standalone platform source.
message Platform {
  uint64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  string name = 4;
  string type = 5;
  bool enabled = 6;
  // Typed settings for this platform type.
  oneof settings {
    DiscordPlatformSettings discord_settings = 7;
  }
}

// Agent represents a standalone LLM agent.
message Agent {
  uint64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  string name = 4;
  string base_url = 5;
  string api_key = 6;
  string org_id = 11;
  string model = 7;
  string system_prompt = 8;
  int32 batch_size = 9;
  int32 batch_timeout = 10;
}

// Reporter represents a standalone reporter destination.
message Reporter {
  uint64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  string name = 4;
  string type = 5;
  bool enabled = 6;
  // Typed settings for this reporter type.
  oneof settings {
    GitHubReporterSettings github_settings = 7;
  }
}

// Pipeline composes a Product + Platform + Agent + Reporters.
message Pipeline {
  uint64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  string name = 4;
  bool enabled = 5;
  uint64 product_id = 6;
  uint64 platform_id = 7;
  uint64 agent_id = 8;
  repeated uint64 reporter_ids = 9;
  Product product = 10;
  Platform platform = 11;
  Agent agent = 12;
  repeated Reporter reporters = 13;
}

// Insight represents a detected insight (bug, feature, sentiment, etc.) from community messages.
message Insight {
  uint64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  uint64 product_id = 4;
  string title = 5;
  string description = 6;
  string severity = 7;
  string category = 8;
  string fingerprint = 9;
  string status = 10;
  string source_msg_ids = 11;
  string product_name = 12;
  repeated Report reports = 13;
}

// Report represents an external ticket filed by a reporter.
message Report {
  uint64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  uint64 insight_id = 4;
  string reporter_type = 5;
  string external_id = 6;
  string external_url = 7;
  string status = 8;
}

// Message represents an incoming platform message.
message Message {
  uint64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  uint64 product_id = 3;
  string platform_type = 4;
  string external_id = 5;
  string channel_id = 6;
  string author_id = 7;
  string author_name = 8;
  string content = 9;
  google.protobuf.Timestamp timestamp = 10;
  bool processed = 11;
}

// PipelineStatus represents the runtime state of a pipeline.
message PipelineStatus {
  uint64 pipeline_id = 1;
  string pipeline_name = 2;
  string product_name = 3;
  bool running = 4;
  bool healthy = 5;
}
