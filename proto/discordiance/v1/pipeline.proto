syntax = "proto3";

package discordiance.v1;

import "discordiance/v1/types.proto";

option go_package = "github.com/nickheyer/discordiance/pkg/proto/discordiance/v1;discordiancev1";

// PipelineService provides CRUD and pipeline control operations.
service PipelineService {
  // ListPipelines returns all pipelines.
  rpc ListPipelines(ListPipelinesRequest) returns (ListPipelinesResponse) {}
  // GetPipeline returns a single pipeline by ID.
  rpc GetPipeline(GetPipelineRequest) returns (GetPipelineResponse) {}
  // CreatePipeline creates a new pipeline.
  rpc CreatePipeline(CreatePipelineRequest) returns (CreatePipelineResponse) {}
  // UpdatePipeline updates an existing pipeline.
  rpc UpdatePipeline(UpdatePipelineRequest) returns (UpdatePipelineResponse) {}
  // DeletePipeline deletes a pipeline.
  rpc DeletePipeline(DeletePipelineRequest) returns (DeletePipelineResponse) {}
  // StartPipeline starts a pipeline.
  rpc StartPipeline(StartPipelineRequest) returns (StartPipelineResponse) {}
  // StopPipeline stops a pipeline.
  rpc StopPipeline(StopPipelineRequest) returns (StopPipelineResponse) {}
  // RestartPipeline restarts a pipeline.
  rpc RestartPipeline(RestartPipelineRequest) returns (RestartPipelineResponse) {}
  // GetPipelineStatus returns the status of all pipelines.
  rpc GetPipelineStatus(GetPipelineStatusRequest) returns (GetPipelineStatusResponse) {}
  // BackfillPipeline triggers a message backfill for a pipeline.
  rpc BackfillPipeline(BackfillPipelineRequest) returns (BackfillPipelineResponse) {}
}

// ListPipelinesRequest is empty.
message ListPipelinesRequest {}

// ListPipelinesResponse contains all pipelines.
message ListPipelinesResponse {
  repeated Pipeline pipelines = 1;
}

// GetPipelineRequest requests a pipeline by ID.
message GetPipelineRequest {
  uint64 id = 1;
}

// GetPipelineResponse contains the requested pipeline.
message GetPipelineResponse {
  Pipeline pipeline = 1;
}

// CreatePipelineRequest creates a pipeline.
message CreatePipelineRequest {
  string name = 1;
  uint64 product_id = 2;
  uint64 platform_id = 3;
  uint64 agent_id = 4;
  repeated uint64 reporter_ids = 5;
  bool enabled = 6;
}

// CreatePipelineResponse contains the created pipeline.
message CreatePipelineResponse {
  Pipeline pipeline = 1;
}

// UpdatePipelineRequest updates a pipeline.
message UpdatePipelineRequest {
  uint64 id = 1;
  string name = 2;
  uint64 product_id = 3;
  uint64 platform_id = 4;
  uint64 agent_id = 5;
  repeated uint64 reporter_ids = 6;
  bool enabled = 7;
}

// UpdatePipelineResponse contains the updated pipeline.
message UpdatePipelineResponse {
  Pipeline pipeline = 1;
}

// DeletePipelineRequest deletes a pipeline by ID.
message DeletePipelineRequest {
  uint64 id = 1;
}

// DeletePipelineResponse is empty.
message DeletePipelineResponse {}

// StartPipelineRequest starts a pipeline by ID.
message StartPipelineRequest {
  uint64 pipeline_id = 1;
}

// StartPipelineResponse is empty on success.
message StartPipelineResponse {}

// StopPipelineRequest stops a pipeline by ID.
message StopPipelineRequest {
  uint64 pipeline_id = 1;
}

// StopPipelineResponse is empty on success.
message StopPipelineResponse {}

// RestartPipelineRequest restarts a pipeline.
message RestartPipelineRequest {
  uint64 pipeline_id = 1;
}

// RestartPipelineResponse is empty on success.
message RestartPipelineResponse {}

// GetPipelineStatusRequest is empty.
message GetPipelineStatusRequest {}

// GetPipelineStatusResponse contains pipeline statuses.
message GetPipelineStatusResponse {
  repeated PipelineStatus statuses = 1;
}

// BackfillPipelineRequest triggers backfill for a pipeline.
message BackfillPipelineRequest {
  uint64 pipeline_id = 1;
}

// BackfillPipelineResponse is empty on success.
message BackfillPipelineResponse {}
