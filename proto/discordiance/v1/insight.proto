syntax = "proto3";

package discordiance.v1;

import "discordiance/v1/types.proto";

option go_package = "github.com/nickheyer/discordiance/pkg/proto/discordiance/v1;discordiancev1";

// InsightService provides operations for viewing and managing insights.
service InsightService {
  // ListInsights returns all insights.
  rpc ListInsights(ListInsightsRequest) returns (ListInsightsResponse) {}
  // GetInsight returns a single insight by ID.
  rpc GetInsight(GetInsightRequest) returns (GetInsightResponse) {}
  // UpdateInsightStatus updates the status of an insight.
  rpc UpdateInsightStatus(UpdateInsightStatusRequest) returns (UpdateInsightStatusResponse) {}
  // FileInsightToReporter manually files an insight to a specific reporter.
  rpc FileInsightToReporter(FileInsightToReporterRequest) returns (FileInsightToReporterResponse) {}
}

// ListInsightsRequest lists insights with optional filters.
message ListInsightsRequest {
  uint64 product_id = 1;
  string status = 2;
  int32 page_size = 3;
  int32 page = 4;
}

// ListInsightsResponse contains a list of insights.
message ListInsightsResponse {
  repeated Insight insights = 1;
  int32 total_count = 2;
}

// GetInsightRequest requests an insight by ID.
message GetInsightRequest {
  uint64 id = 1;
}

// GetInsightResponse contains the requested insight.
message GetInsightResponse {
  Insight insight = 1;
}

// UpdateInsightStatusRequest updates an insight's status.
message UpdateInsightStatusRequest {
  uint64 id = 1;
  string status = 2;
}

// UpdateInsightStatusResponse contains the updated insight.
message UpdateInsightStatusResponse {
  Insight insight = 1;
}

// FileInsightToReporterRequest files an insight to a specific reporter.
message FileInsightToReporterRequest {
  uint64 insight_id = 1;
  uint64 reporter_id = 2;
}

// FileInsightToReporterResponse contains the created report.
message FileInsightToReporterResponse {
  Report report = 1;
}
