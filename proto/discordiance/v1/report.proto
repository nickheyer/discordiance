syntax = "proto3";

package discordiance.v1;

import "discordiance/v1/common.proto";
import "discordiance/v1/insight.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/nickheyer/discordiance/pkg/proto/discordiance/v1;discordiancev1";

// ReportSummary holds aggregate counts for a report.
message ReportSummary {
  int32 total_insights = 1;
  int32 hot_count = 2;
  int32 burn_count = 3;
  int32 cold_count = 4;
}

// ReportEntry is a single classified insight within a report.
message ReportEntry {
  string insight_id = 1;
  InsightState state = 2;
  string content_preview = 3;
  string classification_reason = 4;
  string platform_id = 5;
  string source_url = 6;
}

// Report is a snapshot generated by the internal soft reporter for a pipeline.
message Report {
  string id = 1;
  string pipeline_id = 2;
  string product_id = 3;
  ReportSummary summary = 4;
  repeated ReportEntry entries = 5;
  google.protobuf.Timestamp generated_at = 6;
}

// ReportService provides read access to internally generated reports.
service ReportService {
  // GetReport retrieves a report by ID.
  rpc GetReport(GetReportRequest) returns (GetReportResponse) {}
  // ListReports returns a paginated list of reports for a pipeline.
  rpc ListReports(ListReportsRequest) returns (ListReportsResponse) {}
}

// GetReportRequest identifies a report to retrieve.
message GetReportRequest {
  string id = 1;
}

// GetReportResponse returns the requested report.
message GetReportResponse {
  Report report = 1;
}

// ListReportsRequest supports filtering and pagination for report listing.
message ListReportsRequest {
  PaginationRequest pagination = 1;
  string pipeline_id = 2;
}

// ListReportsResponse returns a page of reports.
message ListReportsResponse {
  repeated Report reports = 1;
  PaginationResponse pagination = 2;
}
