syntax = "proto3";

package discordiance.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nickheyer/discordiance/pkg/proto/discordiance/v1;discordiancev1";

// ProductFileService provides file management for product context.
service ProductFileService {
  // UploadProductFile uploads a file for a product.
  rpc UploadProductFile(UploadProductFileRequest) returns (UploadProductFileResponse) {}
  // ListProductFiles lists all files for a product.
  rpc ListProductFiles(ListProductFilesRequest) returns (ListProductFilesResponse) {}
  // DeleteProductFile deletes a file.
  rpc DeleteProductFile(DeleteProductFileRequest) returns (DeleteProductFileResponse) {}
  // GetProductFileContent returns the content of a file.
  rpc GetProductFileContent(GetProductFileContentRequest) returns (GetProductFileContentResponse) {}
}

// ProductFile represents an uploaded file for product context.
message ProductFile {
  uint64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  uint64 product_id = 3;
  string filename = 4;
  string mime_type = 5;
  int64 size = 6;
}

// UploadProductFileRequest uploads a file.
message UploadProductFileRequest {
  uint64 product_id = 1;
  string filename = 2;
  string mime_type = 3;
  bytes content = 4;
}

// UploadProductFileResponse contains the uploaded file metadata.
message UploadProductFileResponse {
  ProductFile file = 1;
}

// ListProductFilesRequest lists files for a product.
message ListProductFilesRequest {
  uint64 product_id = 1;
}

// ListProductFilesResponse contains the list of files.
message ListProductFilesResponse {
  repeated ProductFile files = 1;
  int64 total_size = 2;
}

// DeleteProductFileRequest deletes a file by ID.
message DeleteProductFileRequest {
  uint64 id = 1;
}

// DeleteProductFileResponse is empty.
message DeleteProductFileResponse {}

// GetProductFileContentRequest requests file content.
message GetProductFileContentRequest {
  uint64 id = 1;
}

// GetProductFileContentResponse contains file content.
message GetProductFileContentResponse {
  ProductFile file = 1;
  bytes content = 2;
}
