syntax = "proto3";

package discordiance.v1;

import "discordiance/v1/types.proto";

option go_package = "github.com/nickheyer/discordiance/pkg/proto/discordiance/v1;discordiancev1";

// ReporterService provides CRUD for reporters.
service ReporterService {
  // ListReporters returns all reporters.
  rpc ListReporters(ListReportersRequest) returns (ListReportersResponse) {}
  // GetReporter returns a single reporter by ID.
  rpc GetReporter(GetReporterRequest) returns (GetReporterResponse) {}
  // CreateReporter creates a new reporter.
  rpc CreateReporter(CreateReporterRequest) returns (CreateReporterResponse) {}
  // UpdateReporter updates an existing reporter.
  rpc UpdateReporter(UpdateReporterRequest) returns (UpdateReporterResponse) {}
  // DeleteReporter deletes a reporter.
  rpc DeleteReporter(DeleteReporterRequest) returns (DeleteReporterResponse) {}
  // ListAvailableReporters returns registered reporter type names.
  rpc ListAvailableReporters(ListAvailableReportersRequest) returns (ListAvailableReportersResponse) {}
}

// ListReportersRequest is empty.
message ListReportersRequest {}

// ListReportersResponse contains all reporters.
message ListReportersResponse {
  repeated Reporter reporters = 1;
}

// GetReporterRequest requests a reporter by ID.
message GetReporterRequest {
  uint64 id = 1;
}

// GetReporterResponse contains the requested reporter.
message GetReporterResponse {
  Reporter reporter = 1;
}

// CreateReporterRequest creates a reporter.
message CreateReporterRequest {
  string name = 1;
  string type = 2;
  bool enabled = 3;
  // Typed settings for this reporter type.
  oneof settings {
    GitHubReporterSettings github_settings = 4;
  }
}

// CreateReporterResponse contains the created reporter.
message CreateReporterResponse {
  Reporter reporter = 1;
}

// UpdateReporterRequest updates a reporter.
message UpdateReporterRequest {
  uint64 id = 1;
  string name = 2;
  string type = 3;
  bool enabled = 4;
  // Typed settings for this reporter type.
  oneof settings {
    GitHubReporterSettings github_settings = 5;
  }
}

// UpdateReporterResponse contains the updated reporter.
message UpdateReporterResponse {
  Reporter reporter = 1;
}

// DeleteReporterRequest deletes a reporter by ID.
message DeleteReporterRequest {
  uint64 id = 1;
}

// DeleteReporterResponse is empty.
message DeleteReporterResponse {}

// ListAvailableReportersRequest is empty.
message ListAvailableReportersRequest {}

// ListAvailableReportersResponse contains available reporter type names.
message ListAvailableReportersResponse {
  repeated string reporters = 1;
}
