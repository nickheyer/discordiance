syntax = "proto3";

package discordiance.v1;

import "discordiance/v1/types.proto";

option go_package = "github.com/nickheyer/discordiance/pkg/proto/discordiance/v1;discordiancev1";

// ReporterConfigService provides CRUD for reporter configurations.
service ReporterConfigService {
  // CreateReporterConfig creates a new reporter config for a product.
  rpc CreateReporterConfig(CreateReporterConfigRequest) returns (CreateReporterConfigResponse) {}
  // UpdateReporterConfig updates an existing reporter config.
  rpc UpdateReporterConfig(UpdateReporterConfigRequest) returns (UpdateReporterConfigResponse) {}
  // DeleteReporterConfig deletes a reporter config.
  rpc DeleteReporterConfig(DeleteReporterConfigRequest) returns (DeleteReporterConfigResponse) {}
  // ListAvailableReporters returns registered reporter type names.
  rpc ListAvailableReporters(ListAvailableReportersRequest) returns (ListAvailableReportersResponse) {}
}

// CreateReporterConfigRequest creates a reporter config.
message CreateReporterConfigRequest {
  uint64 product_id = 1;
  string type = 2;
  bool enabled = 3;
  map<string, string> settings = 4;
}

// CreateReporterConfigResponse contains the created reporter config.
message CreateReporterConfigResponse {
  ReporterConfig reporter_config = 1;
}

// UpdateReporterConfigRequest updates a reporter config.
message UpdateReporterConfigRequest {
  uint64 id = 1;
  string type = 2;
  bool enabled = 3;
  map<string, string> settings = 4;
}

// UpdateReporterConfigResponse contains the updated reporter config.
message UpdateReporterConfigResponse {
  ReporterConfig reporter_config = 1;
}

// DeleteReporterConfigRequest deletes a reporter config by ID.
message DeleteReporterConfigRequest {
  uint64 id = 1;
}

// DeleteReporterConfigResponse is empty.
message DeleteReporterConfigResponse {}

// ListAvailableReportersRequest is empty.
message ListAvailableReportersRequest {}

// ListAvailableReportersResponse contains available reporter type names.
message ListAvailableReportersResponse {
  repeated string reporters = 1;
}
