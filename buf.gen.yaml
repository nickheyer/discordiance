version: v2
plugins:
  # Generate Go code with protoc-gen-go
  - remote: buf.build/protocolbuffers/go
    out: pkg/proto
    opt:
      - paths=source_relative

  # Generate Connect-Go
  - remote: buf.build/connectrpc/go
    out: pkg/proto
    opt:
      - paths=source_relative

  # Generate TypeScript messages + service descriptors (protobuf-es v2)
  - remote: buf.build/bufbuild/es
    out: web/discordiance/src/gen
    opt:
      - target=ts
