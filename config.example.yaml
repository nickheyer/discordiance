server:
  port: "8067"
  host: "0.0.0.0"
  read_timeout: 15
  write_timeout: 15
  idle_timeout: 60

database:
  path: "./data/discordiance.db"
  auto_migrate: true

products:
  - name: "My Product"
    platforms:
      - type: discord
        settings:
          token: "your-discord-bot-token"
          channel_ids: "channel1,channel2"  # comma-separated

    agent:
      base_url: "https://api.openai.com/v1"
      api_key: "your-openai-api-key"
      org_id: ""  # optional OpenAI org ID
      model: "gpt-4o-mini"
      batch_size: 10
      batch_timeout_seconds: 30

    reporters:
      - type: github
        settings:
          token: "your-github-token"
          repo: "owner/repo"
          labels: "discordiance,auto-detected"
